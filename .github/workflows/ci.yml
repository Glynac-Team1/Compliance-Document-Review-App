name: CI
# event triggers for the CI pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true #cancel in progress to prevent wasted CI runs

jobs:
  python:
    name: Python lint, migrations, and tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
          POSTGRES_DB: compliance_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compliance -d compliance_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://compliance:compliance@127.0.0.1:5432/compliance_review
      REDIS_URL: redis://127.0.0.1:6379/0
      SESSION_SECRET: ci-only-session-secret
      OFFICER_SIGNUP_CODE: ci-only-officer-code
      ENVIRONMENT: test
      LLM_API_KEY: ''
      LLM_PROVIDER: gemini
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            worker/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-${{ hashFiles('worker/data_eng/embeddings.py') }}

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libmagic1

      - name: Install Python dependencies
        run: python -m pip install --requirement backend/requirements.txt --requirement worker/requirements.txt ruff==0.11.2

      - name: Run Ruff validation
        run: python -m ruff check backend worker
        continue-on-error: true

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=compliance psql \
            -h 127.0.0.1 \
            -U compliance \
            -d compliance_review \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"      
      - name: Apply Alembic migrations
        run: python -m alembic upgrade head

      - name: Seed integration-test corpora
        run: |
          python -m worker.data_eng.seed_rules_corpus
          python -m worker.data_eng.seed_precedents_corpus

      - name: Run backend and worker tests
        run: python -m pytest backend/tests worker/ai worker/data_eng -v

  frontend:
    name: Frontend validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript validation
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build and Compose validation
    runs-on: ubuntu-24.04
    env:
      SESSION_SECRET: ci-only-session-secret
      OFFICER_SIGNUP_CODE: ci-only-officer-code
      ENVIRONMENT: test
      LLM_API_KEY: ''
      LLM_PROVIDER: gemini
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build --pull backend worker frontend